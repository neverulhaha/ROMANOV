<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B5"/>
      <stop offset="35%" stop-color="#E2C17C"/>
      <stop offset="70%" stop-color="#C59B4E"/>
      <stop offset="100%" stop-color="#9A7432"/>
    </linearGradient>

    <!-- Dark Imperial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142C23"/>
      <stop offset="100%" stop-color="#07130F"/>
    </radialGradient>
  </defs>

  <!-- Background Box with Rounded Corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Royal Crown Accent -->
  <g transform="translate(256, 115) scale(0.9)" fill="url(#goldGrad)">
    <path d="M-40,16 L40,16 L32,24 L-32,24 Z"/>
    <path d="M-44,12 L-40,-12 L-20,4 L0,-24 L20,4 L40,-12 L44,12 Z"/>
    <circle cx="0" cy="-28" r="5"/>
    <circle cx="-40" cy="-15" r="4"/>
    <circle cx="40" cy="-15" r="4"/>
  </g>

  <!-- Imperial Letter "Р" Monogram -->
  <g fill="url(#goldGrad)">
    <path d="
      M 155 160
      H 285
      C 348 160, 388 192, 388 245
      C 388 298, 348 328, 285 328
      H 225
      V 382
      C 225 395, 235 400, 250 402
      V 410
      H 150
      V 402
      C 165 400, 175 395, 175 382
      V 188
      C 175 175, 165 170, 150 168
      V 160
      Z
      M 225 186
      V 302
      H 278
      C 320 302, 342 280, 342 244
      C 342 208, 320 186, 278 186
      H 225
      Z
    "/>
  </g>

  <!-- Year 1792 Subtext -->
  <text x="256" y="456" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">1792</text>
</svg>
